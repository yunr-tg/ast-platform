# task-gateway 专属配置
# 此文件应上传到Nacos Config，data-id: task-gateway.yaml

server:
  port: ${GATEWAY_PORT:8080}
  tomcat:
    threads:
      max: ${GATEWAY_TOMCAT_MAX_THREADS:200}
      min-spare: ${GATEWAY_TOMCAT_MIN_THREADS:10}
    accept-count: ${GATEWAY_TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${GATEWAY_TOMCAT_MAX_CONN:10000}
    connection-timeout: ${GATEWAY_TOMCAT_CONN_TIMEOUT:5000}

spring:
  datasource:
    hikari:
      pool-name: Gateway-HikariPool
      maximum-pool-size: ${GATEWAY_DB_POOL_MAX:20}
      minimum-idle: ${GATEWAY_DB_POOL_MIN:5}

ast:
  gateway:
    storage-type: jdbc
    submit-topic: ${GATEWAY_SUBMIT_TOPIC:AST_TASK_SUBMIT_TOPIC}
    outbox-batch-size: ${GATEWAY_OUTBOX_BATCH:100}
    immediate-publish-enabled: ${GATEWAY_IMMEDIATE_PUBLISH:true}
    mock-send-success: ${GATEWAY_MOCK_SEND:false}
    outbox-republish-fixed-delay-ms: ${GATEWAY_OUTBOX_DELAY:3000}
    outbox-base-retry-delay-ms: ${GATEWAY_OUTBOX_RETRY_DELAY:5000}
    idempotent-cache-ttl-seconds: ${GATEWAY_IDEMPOTENT_TTL:86400}
    submit-rate-limit-per-second: ${GATEWAY_RATE_LIMIT:1000}
    max-payload-size-bytes: ${GATEWAY_MAX_PAYLOAD:1048576}
    biz-key-max-length: ${GATEWAY_BIZ_KEY_MAX:128}
    request-id-max-length: ${GATEWAY_REQUEST_ID_MAX:128}