# AST Platform 数据源配置
# 此文件应上传到Nacos Config，data-id: ast-platform-datasource.yaml

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:ast_platform}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      pool-name: AST-HikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:10000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1200000}
      connection-test-query: SELECT 1
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:3000}
      initialization-fail-timeout: 1
      auto-commit: true
      read-only: false
      register-mbeans: true

mybatis-plus:
  configuration:
    default-fetch-size: 100
    default-statement-timeout: 30000
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
