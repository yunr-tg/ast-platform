# task-scheduler 开发环境配置
# 此文件应上传到Nacos Config，data-id: task-scheduler-dev.yaml

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ast_scheduler;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:

logging:
  level:
    root: INFO
    com.ast.platform: DEBUG
    org.springframework.web: DEBUG

ast:
  scheduler:
    local-queue-enabled: true
    dispatcher-fixed-delay-ms: 2000
    retry-fixed-delay-ms: 2000

management:
  tracing:
    sampling:
      probability: 1.0